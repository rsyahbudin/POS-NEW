[program:pos-horizon]
process_name=%(program_name)s
command=php /var/www/pos/current/artisan horizon
autostart=true
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/www/pos/shared/storage/logs/horizon.log
stopwaitsecs=3600

[program:pos-reverb]
process_name=%(program_name)s
command=php /var/www/pos/current/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/www/pos/shared/storage/logs/reverb.log
